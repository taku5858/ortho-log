<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4a9d8f">
<meta name="description" content="矯正の変化を、シンプルに記録。">

<!-- PWA -->
<link rel="manifest" href="manifest.json">

<!-- iOS: ホーム画面追加時にアプリらしく表示するための設定 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="OrthoLog">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<link rel="icon" href="icons/icon-192.png">
<title>OrthoLog</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="app-header">
    <h1>OrthoLog</h1>
    <p class="app-subtitle">矯正の変化を、シンプルに記録。</p>
  </header>

  <main>
    <section class="capture-section">
      <button id="captureBtn" class="btn btn-primary" type="button">📷 写真を撮る</button>
      <input type="file" id="fileInput" accept="image/*" capture="environment" hidden>

      <div id="previewWrap" class="preview-wrap" hidden>
        <img id="previewImg" alt="撮影した写真のプレビュー">
        <button id="clearPreviewBtn" class="btn btn-text" type="button">✕ 写真を取り消す</button>
      </div>

      <label for="memoInput" class="field-label">メモ</label>
      <textarea id="memoInput" rows="3" placeholder="気になったこと、痛みなど（空欄でもOK）"></textarea>

      <button id="saveBtn" class="btn btn-primary" type="button" disabled>保存する</button>

      <p id="statusMsg" class="status-msg" role="status" aria-live="polite"></p>
    </section>

    <hr class="divider">

    <section class="records-section">
      <h2>これまでの記録</h2>
      <p id="storageInfo" class="storage-info"></p>

      <div id="recordList" class="record-list"></div>
      <p id="emptyMsg" class="empty-msg" hidden>まだ記録がありません</p>
    </section>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4a9d8f">
<meta name="description" content="矯正の変化を、シンプルに記録。">

<!-- PWA -->
<link rel="manifest" href="manifest.json">

<!-- iOS: ホーム画面追加時にアプリらしく表示するための設定 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="OrthoLog">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<link rel="icon" href="icons/icon-192.png">
<title>OrthoLog</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="app-header">
    <h1>OrthoLog</h1>
    <p class="app-subtitle">矯正の変化を、シンプルに記録。</p>
  </header>

  <main>
    <section class="capture-section">
      <button id="captureBtn" class="btn btn-primary" type="button">📷 写真を撮る</button>
      <input type="file" id="cameraInput" accept="image/*" capture="user" hidden>

      <button id="libraryBtn" class="btn btn-secondary" type="button">🖼️ ライブラリから選ぶ</button>
      <input type="file" id="libraryInput" accept="image/*" hidden>

      <div id="previewWrap" class="preview-wrap" hidden>
        <img id="previewImg" alt="撮影した写真のプレビュー">
        <p id="capturedAtText" class="captured-at"></p>
        <button id="clearPreviewBtn" class="btn btn-text" type="button">✕ 写真を取り消す</button>
      </div>

      <label for="memoInput" class="field-label">メモ</label>
      <textarea id="memoInput" rows="3" placeholder="気になったこと、痛みなど（空欄でもOK）"></textarea>

      <button id="saveBtn" class="btn btn-primary" type="button" disabled>保存する</button>

      <p id="statusMsg" class="status-msg" role="status" aria-live="polite"></p>
    </section>

    <hr class="divider">

    <section class="records-section">
      <h2>これまでの記録</h2>
      <p id="storageInfo" class="storage-info"></p>

      <div id="recordList" class="record-list"></div>
      <p id="emptyMsg" class="empty-msg" hidden>まだ記録がありません</p>
    </section>
  </main>
</div>

<!-- 撮影ガイド画面: 端末カメラをその場で表示し、位置合わせの補助線を重ねる -->
<div id="cameraOverlay" class="camera-overlay" hidden>
  <video id="cameraVideo" class="camera-video" autoplay playsinline muted></video>
  <div class="camera-guides" aria-hidden="true">
    <div class="guide-line guide-vertical"></div>
    <div class="guide-line guide-horizontal"></div>
    <div class="guide-oval"></div>
  </div>
  <div class="camera-hint">
    <p>前歯を中央に合わせてください</p>
    <p>できるだけ正面から撮影してください</p>
  </div>
  <div class="camera-controls">
    <button id="cancelCameraBtn" class="camera-btn-text" type="button">キャンセル</button>
    <button id="shutterBtn" class="shutter-btn" type="button" aria-label="撮影"></button>
    <button id="switchCameraBtn" class="camera-btn-text" type="button">🔄 切替</button>
  </div>
</div>

<!-- トリミング画面: 撮影後・ライブラリ選択後に、口元付近を手動で微調整して切り抜く -->
<div id="cropOverlay" class="crop-overlay" hidden>
  <p class="crop-hint">位置と大きさを調整してください</p>
  <div id="cropViewport" class="crop-viewport">
    <img id="cropImage" class="crop-image" alt="" draggable="false">
  </div>
  <div class="crop-zoom-row">
    <span class="crop-zoom-label">拡大</span>
    <input type="range" id="zoomSlider" min="1" max="3" step="0.01" value="1">
  </div>
  <div class="crop-actions">
    <button id="cropCancelBtn" class="btn btn-secondary" type="button">キャンセル</button>
    <button id="cropConfirmBtn" class="btn btn-primary" type="button">この範囲で保存</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
